name: ZAVQERA Preview OpenAI Smoke

on:
  push:
    branches:
      - "zavqera/ai-planner-integration"
    paths:
      - ".github/workflows/preview-openai-smoke.yml"

permissions:
  contents: read

jobs:
  preview-openai:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Wait for Netlify preview
        run: |
          set -euo pipefail
          url="https://deploy-preview-29--unique-kringle-3ce321.netlify.app"
          for i in $(seq 1 36); do
            code="$(curl -sS -o /tmp/root.html -w '%{http_code}' "$url/")" || code="000"
            echo "attempt=$i http=$code"
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 10
          done
          echo "Preview did not become ready in time."
          exit 1

      - name: Verify public routes
        run: |
          set -euo pipefail
          url="https://deploy-preview-29--unique-kringle-3ce321.netlify.app"
          root="$(curl -sS -o /dev/null -w '%{http_code}' "$url/")"
          signin="$(curl -sS -o /dev/null -w '%{http_code}' "$url/auth/sign-in")"
          app="$(curl -sS -o /dev/null -w '%{http_code}' -L "$url/app")"
          echo "/=$root /auth/sign-in=$signin /app(final)=$app"
          test "$root" = "200"
          test "$signin" = "200"
          test "$app" = "200"

      - name: Verify real OpenAI mission planning
        run: |
          set -euo pipefail
          url="https://deploy-preview-29--unique-kringle-3ce321.netlify.app/api/ai/plan/anonymous"
          body="$(curl -sS -c /tmp/zavqera-cookie.txt -b /tmp/zavqera-cookie.txt \
            -H 'content-type: application/json' \
            --data '{"goal":"Plan a simple launch checklist for a small software product"}' \
            "$url")"
          echo "$body" > /tmp/ai.json
          node <<'NODE'
          const fs = require("fs");
          const data = JSON.parse(fs.readFileSync("/tmp/ai.json","utf8"));
          if (data.provider_mode !== "openai") throw new Error("provider_mode is not openai");
          if (typeof data.title !== "string" || !data.title.trim()) throw new Error("missing title");
          if (!Array.isArray(data.steps) || data.steps.length < 3) throw new Error("fewer than 3 steps");
          console.log(JSON.stringify({
            provider_mode: data.provider_mode,
            title: data.title,
            steps: data.steps.length,
            anonymous: data.anonymous
          }));
          NODE
