name: ZAVQERA Web CI

on:
  push:
    # main is the branch Netlify builds for production. It was missing here,
    # so the production build command (npm run build) was never exercised by
    # CI on main and a build break reached production undetected.
    branches: ["main", "zavqera/**"]
    paths:
      - "apps/web/**"
      - "netlify.toml"
      - ".github/workflows/web.yml"
  pull_request:
    paths:
      - "apps/web/**"
      - "netlify.toml"
      - ".github/workflows/web.yml"

permissions:
  contents: read

jobs:
  verify-web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Static authorization boundary tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build
