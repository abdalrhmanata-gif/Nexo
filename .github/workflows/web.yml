name: ZAVQERA Web CI

on:
  push:
    branches: ["zavqera/**"]
    paths:
      - "apps/web/**"
      - ".github/workflows/web.yml"
  pull_request:
    paths:
      - "apps/web/**"
      - ".github/workflows/web.yml"

permissions:
  contents: read

jobs:
  verify-web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Static authorization boundary tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Smoke test anonymous AI route without provider or database calls
        shell: bash
        env:
          ZAVQERA_ANONYMOUS_AI_SALT: ci-only-no-provider-smoke-salt
        run: |
          set -euo pipefail
          port=3187
          base_url="http://127.0.0.1:${port}"
          server_log="${RUNNER_TEMP}/zavqera-anonymous-ai-route-smoke.log"
          response_file="${RUNNER_TEMP}/zavqera-anonymous-ai-route-smoke.json"

          npm run start -- --hostname 127.0.0.1 --port "${port}" >"${server_log}" 2>&1 &
          server_pid=$!
          cleanup() {
            kill "${server_pid}" 2>/dev/null || true
            wait "${server_pid}" 2>/dev/null || true
          }
          trap cleanup EXIT

          ready=false
          for attempt in $(seq 1 30); do
            if curl --silent --fail "${base_url}/auth/sign-in" >/dev/null; then
              ready=true
              break
            fi
            if ! kill -0 "${server_pid}" 2>/dev/null; then
              cat "${server_log}"
              exit 1
            fi
            sleep 1
          done
          if [ "${ready}" != true ]; then
            cat "${server_log}"
            echo "::error::Production Next.js server did not become ready."
            exit 1
          fi

          status="$(curl --silent --show-error -o "${response_file}" -w '%{http_code}' \
            -X POST "${base_url}/api/ai/plan/anonymous" \
            -H 'Content-Type: application/json' \
            --data '{}')"
          if [ "${status}" != 400 ]; then
            cat "${response_file}"
            cat "${server_log}"
            echo "::error::Anonymous route smoke expected HTTP 400 for a missing goal; got ${status}."
            exit 1
          fi
          python3 - "${response_file}" <<'PY'
          import json, sys
          from pathlib import Path

          response = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          assert response == {"error": "Enter a goal between 1 and 900 characters."}, response
          PY
          echo "anonymous_ai_route_no_provider_smoke=PASS"
          echo "http_status=400"
          echo "provider_and_database_calls=0"
