name: ZAVQERA Web CI

on:
  push:
    branches: ["zavqera/**"]
    paths:
      - "apps/web/**"
      - ".github/workflows/web.yml"
  pull_request:
    paths:
      - "apps/web/**"
      - ".github/workflows/web.yml"

permissions:
  contents: read

jobs:
  verify-web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Static authorization boundary tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Smoke-test generated robots route
        shell: bash
        run: |
          set -euo pipefail
          log_file="$(mktemp)"
          robots_file="$(mktemp)"
          PORT=3100 npx next start --hostname 127.0.0.1 >"$log_file" 2>&1 &
          server_pid=$!
          cleanup() {
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
            rm -f "$log_file" "$robots_file"
          }
          trap cleanup EXIT

          status="000"
          for attempt in $(seq 1 30); do
            status="$(curl --silent --output "$robots_file" --write-out '%{http_code}' --connect-timeout 2 --max-time 5 http://127.0.0.1:3100/robots.txt || true)"
            if [ "$status" = "200" ]; then
              break
            fi
            if [ "$status" != "000" ]; then
              echo "::error::/robots.txt returned HTTP $status instead of 200."
              cat "$robots_file"
              cat "$log_file"
              exit 1
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              echo "::error::Next.js server exited before /robots.txt became available."
              cat "$log_file"
              exit 1
            fi
            sleep 1
          done

          if [ "$status" != "200" ]; then
            echo "::error::/robots.txt did not become available within 30 seconds."
            cat "$log_file"
            exit 1
          fi

          grep -Eiq '^User-Agent:[[:space:]]*\*[[:space:]]*$' "$robots_file"
          grep -Eiq '^Allow:[[:space:]]*/[[:space:]]*$' "$robots_file"
          grep -Eiq '^Disallow:[[:space:]]*/app([[:space:]]|$)' "$robots_file"
          grep -Eiq '^Disallow:[[:space:]]*/api/' "$robots_file"
          grep -Eiq '^Disallow:[[:space:]]*/auth/' "$robots_file"
          echo "PASS: /robots.txt returned HTTP 200 with the expected public and private-path crawl rules."
          cat "$robots_file"
