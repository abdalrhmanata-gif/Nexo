name: NEXO Flutter CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true

      - name: Toolchain versions
        run: |
          flutter --version
          dart --version

      - name: Verify NEXO MVP
        run: ./tool/verify_project.sh

      - name: Upload diagnostic bundle on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nexo-flutter-ci-diagnostics
          path: |
            pubspec.lock
            .dart_tool/package_config.json
          if-no-files-found: ignore
