name: NEXO Flutter CI

on:
  # Avoid running the same CI twice for feature branches that already have a PR.
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true

      - name: Toolchain versions
        run: |
          flutter --version
          dart --version

      - name: Static contract gate
        run: python3 tool/static_contract_check.py

      - name: Verify Flutter and Dart executables
        run: |
          command -v flutter
          command -v dart

      - name: Install dependencies
        run: flutter pub get
        timeout-minutes: 5

      - name: Verify Dart formatting
        run: |
          if ! dart format --set-exit-if-changed lib test; then
            echo "DART_FORMAT_DIFF_BEGIN" >&2
            git diff -- lib/application/zavqera_ai_planner.dart lib/infrastructure/supabase_config.dart lib/ui/auth_screen.dart lib/ui/intent_builder_screen.dart test/zavqera_ai_planner_test.dart >&2
            echo "DART_FORMAT_DIFF_END" >&2
            exit 1
          fi
        timeout-minutes: 3

      - name: Analyze project source
        run: flutter analyze
        timeout-minutes: 5

      - name: Test AI planner quota failure and manual fallback
        run: flutter test test/zavqera_ai_planner_test.dart
        timeout-minutes: 3

      - name: Run complete Flutter test suite
        run: flutter test
        timeout-minutes: 10

      - name: Upload diagnostic bundle on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nexo-flutter-ci-diagnostics
          path: |
            pubspec.lock
            .dart_tool/package_config.json
            NEXO_STATIC_CONTRACT_REPORT.json
          if-no-files-found: ignore
