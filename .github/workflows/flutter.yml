name: ZAVQERA Flutter CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true

      - name: Toolchain versions
        run: |
          flutter --version
          dart --version

      - name: Verify ZAVQERA MVP
        run: ./tool/verify_project.sh

      - name: Setup Node for web validation
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci

      - name: Run controlled-adapter tests
        working-directory: apps/web
        run: node --test test/mission-authority-controlled-adapter.test.mjs

      - name: Run web tests
        working-directory: apps/web
        run: npm test

      - name: Typecheck web app
        working-directory: apps/web
        run: npm run typecheck

      - name: Upload diagnostic bundle on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: zavqera-flutter-ci-diagnostics
          path: |
            pubspec.lock
            .dart_tool/package_config.json
          if-no-files-found: ignore
