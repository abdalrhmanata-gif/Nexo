name: ZAVQERA Web Deploy (Netlify)

# Deploys the ZAVQERA Web MVP (apps/web) to Netlify.
#
# Production deploys are restricted to the existing release branches.
# PR Deploy Previews are expected from Netlify's Git integration, but that
# integration is not verified for this API/CLI-deployed site. The preview job
# below intentionally fails closed when no PR-specific preview is provisioned.
# The separate local runtime smoke job provides built-app evidence without deploys.

on:
  workflow_dispatch:
  push:
    branches:
      - "zavqera/integrate-origin-main-clean"
      - "zavqera/alternative-web-deployment"
    paths:
      - "apps/web/**"
      - "netlify.toml"
      - ".github/workflows/web-deploy-netlify.yml"
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "apps/web/**"
      - "netlify.toml"
      - ".github/workflows/web-deploy-netlify.yml"

permissions:
  contents: read

concurrency:
  group: zavqera-netlify-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    # workflow_dispatch can target any branch, so enforce the release-branch allowlist here too.
    if: >-
      github.event_name != 'pull_request' &&
      (
        github.ref == 'refs/heads/zavqera/integrate-origin-main-clean' ||
        github.ref == 'refs/heads/zavqera/alternative-web-deployment'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check deploy credentials
        id: creds
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          if [ -z "${NETLIFY_AUTH_TOKEN}" ] || [ -z "${NETLIFY_SITE_ID}" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::NETLIFY_AUTH_TOKEN and/or NETLIFY_SITE_ID are not configured. Skipping deploy."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check Supabase Development configuration
        if: steps.creds.outputs.ready == 'true'
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "${SUPABASE_URL}" ] || [ -z "${SUPABASE_KEY}" ]; then
            echo "::error::NEXT_PUBLIC_SUPABASE_URL and NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY must be set."
            exit 1
          fi
          case "${SUPABASE_URL}" in
            https://mrwmmbytcymqgwvcoywd.supabase.co*) echo "Supabase URL targets ZAVQERA Development." ;;
            *) echo "::error::NEXT_PUBLIC_SUPABASE_URL does not target ZAVQERA Development (mrwmmbytcymqgwvcoywd)."; exit 1 ;;
          esac

      - name: Setup Node
        if: steps.creds.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        if: steps.creds.outputs.ready == 'true'
        working-directory: apps/web
        run: npm ci

      - name: Static authorization boundary tests
        if: steps.creds.outputs.ready == 'true'
        working-directory: apps/web
        run: npm test

      - name: Typecheck
        if: steps.creds.outputs.ready == 'true'
        working-directory: apps/web
        run: npm run typecheck

      - name: Deploy to Netlify
        if: steps.creds.outputs.ready == 'true'
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
        run: npx --yes netlify-cli@latest deploy --build --prod

      - name: Verify public routes
        if: steps.creds.outputs.ready == 'true'
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          set -euo pipefail
          url="$(npx --yes netlify-cli@latest api getSite --data "{\"site_id\":\"${NETLIFY_SITE_ID}\"}" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).ssl_url))')"
          echo "Public URL: ${url}"
          root="$(curl -sS -o /dev/null -w '%{http_code}' "${url}/")"
          signin="$(curl -sS -o /dev/null -w '%{http_code}' "${url}/auth/sign-in")"
          app="$(curl -sS -o /dev/null -w '%{http_code}' "${url}/app")"
          appdest="$(curl -sS -o /dev/null -w '%{redirect_url}' "${url}/app")"
          echo "/=${root} /auth/sign-in=${signin} /app=${app} -> ${appdest}"
          test "${root}" = "200"
          test "${signin}" = "200"
          case "${appdest}" in
            *"/auth/sign-in"*) echo "Auth middleware verified." ;;
            *) echo "::error::/app did not redirect anonymously to /auth/sign-in."; exit 1 ;;
          esac


  verify-built-runtime:
    # Local production-mode smoke tests only; this job never deploys to Netlify
    # and deliberately has no provider key or hosted Supabase credentials.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        working-directory: apps/web
        run: npm ci

      - name: Build production web app
        working-directory: apps/web
        env:
          NODE_ENV: production
          NEXT_PUBLIC_SUPABASE_URL: ""
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ""
          OPENAI_API_KEY: ""
          OPENAI_MODEL: ""
        run: npx next build

      - name: Smoke-test built app without external services
        working-directory: apps/web
        env:
          NODE_ENV: production
          NEXT_PUBLIC_SUPABASE_URL: ""
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ""
          OPENAI_API_KEY: ""
          OPENAI_MODEL: ""
          ZAVQERA_AI_PROVIDER_MODE: openai
        run: |
          set -euo pipefail
          npx next start --hostname 127.0.0.1 --port 4173 >/tmp/zavqera-next-start.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          ready=false
          for i in $(seq 1 30); do
            if curl --silent --show-error --max-time 3 -o /dev/null http://127.0.0.1:4173/; then
              ready=true
              break
            fi
            sleep 2
          done
          if [ "$ready" != true ]; then
            cat /tmp/zavqera-next-start.log
            echo "::error::Built Next.js server did not become ready."
            exit 1
          fi

          root="$(curl --silent --show-error --max-time 5 -o /dev/null -w '%{http_code}' http://127.0.0.1:4173/)"
          signin="$(curl --silent --show-error --max-time 5 -o /dev/null -w '%{http_code}' http://127.0.0.1:4173/auth/sign-in)"
          ai_unauth="$(curl --silent --show-error --max-time 5 -o /dev/null -w '%{http_code}' -X POST -H 'content-type: application/json' --data '{"goal":"local auth gate smoke test"}' http://127.0.0.1:4173/api/ai/plan)"
          echo "/=$root /auth/sign-in=$signin /api/ai/plan unauthenticated=$ai_unauth"
          test "$root" = "200"
          test "$signin" = "200"
          # No keys or sessions are present. The route must reject the request
          # before quota RPCs or provider dispatch.
          test "$ai_unauth" = "401"

  verify-preview:
    # Secrets are used only for trusted same-repository PRs. This creates a
    # Netlify draft deploy (never production) because Git-connected previews
    # are not provisioned for this API/CLI-managed site.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci

      - name: Create a non-production Netlify draft preview
        id: draft-preview
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          PREVIEW_ALIAS: zavqera-pr-${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [ -z "$NETLIFY_AUTH_TOKEN" ] || [ -z "$NETLIFY_SITE_ID" ]; then
            echo "::error::NETLIFY_AUTH_TOKEN and NETLIFY_SITE_ID are required to create a draft preview."
            exit 1
          fi
          if [ -z "$NEXT_PUBLIC_SUPABASE_URL" ] || [ -z "$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "::error::Supabase Development public configuration is missing."
            exit 1
          fi
          case "$NEXT_PUBLIC_SUPABASE_URL" in
            https://mrwmmbytcymqgwvcoywd.supabase.co*) ;;
            *) echo "::error::Preview target must be ZAVQERA Development (mrwmmbytcymqgwvcoywd)."; exit 1 ;;
          esac

          # No --prod / -p flag: this command creates an isolated draft URL.
          # The alias is PR-specific and does not match a Git branch name.
          deploy_json="$(npx --yes netlify-cli@latest deploy \
            --site "$NETLIFY_SITE_ID" \
            --build \
            --context deploy-preview \
            --alias "$PREVIEW_ALIAS" \
            --json)"
          preview_url="$(printf '%s' "$deploy_json" | node -e '
            let input = "";
            process.stdin.on("data", chunk => input += chunk);
            process.stdin.on("end", () => {
              const deploy = JSON.parse(input);
              const raw = deploy.deploy_url;
              if (typeof raw !== "string") throw new Error("Netlify CLI JSON omitted deploy_url");
              const url = new URL(raw);
              if (url.protocol !== "https:" || !url.hostname.endsWith("unique-kringle-3ce321.netlify.app")) {
                throw new Error("Netlify CLI returned a URL outside the expected preview site");
              }
              process.stdout.write(url.toString());
            });
          ')"
          echo "preview_url=$preview_url" >> "$GITHUB_OUTPUT"
          echo "::notice::Draft preview created: $preview_url"

      - name: Verify preview routes and unauthenticated AI gate
        env:
          PREVIEW_URL: ${{ steps.draft-preview.outputs.preview_url }}
        run: |
          set -euo pipefail
          if [ -z "$PREVIEW_URL" ]; then
            echo "::error::Draft preview URL was not captured from Netlify."
            exit 1
          fi
          url="$PREVIEW_URL"
          root="$(curl --silent --show-error --max-time 20 -o /dev/null -w '%{http_code}' "$url/")"
          signin="$(curl --silent --show-error --max-time 20 -o /dev/null -w '%{http_code}' "$url/auth/sign-in")"
          app="$(curl --silent --show-error --max-time 20 -o /dev/null -w '%{http_code}' -L "$url/app")"
          ai_unauth="$(curl --silent --show-error --max-time 20 -o /dev/null -w '%{http_code}' -X POST -H 'content-type: application/json' --data '{"goal":"auth gate smoke test"}' "$url/api/ai/plan")"
          echo "/=$root /auth/sign-in=$signin /app(final)=$app /api/ai/plan unauthenticated=$ai_unauth"
          test "$root" = "200"
          test "$signin" = "200"
          test "$app" = "200"
          # No bearer/cookie: this request must stop at auth before quota or provider work.
          test "$ai_unauth" = "401"

      - name: Verify real OpenAI mission planning
        # Never run a live provider request from workflow_dispatch or an untrusted fork.
        # Live calls require an explicit marker on a PR from this same repository.
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && contains(github.event.pull_request.body, '[live-openai-planning]')
        env:
          PREVIEW_URL: https://deploy-preview-${{ github.event.pull_request.number }}--unique-kringle-3ce321.netlify.app
        run: |
          set -euo pipefail
          url="$PREVIEW_URL/api/ai/plan/anonymous"
          body="$(curl -sS -c /tmp/zavqera-cookie.txt -b /tmp/zavqera-cookie.txt \
            -H 'content-type: application/json' \
            --data '{"goal":"Plan a simple launch checklist for a small software product"}' \
            "$url")"
          echo "$body" > /tmp/ai.json
          node <<'NODE'
          const fs = require("fs");
          const data = JSON.parse(fs.readFileSync("/tmp/ai.json","utf8"));
          if (data.provider_mode !== "openai") throw new Error("provider_mode is not openai");
          if (typeof data.title !== "string" || !data.title.trim()) throw new Error("missing title");
          if (!Array.isArray(data.steps) || data.steps.length < 3) throw new Error("fewer than 3 steps");
          console.log(JSON.stringify({
            provider_mode: data.provider_mode,
            title: data.title,
            steps: data.steps.length,
            anonymous: data.anonymous
          }));
          NODE

      - name: Check Development-only live research authentication config
        if: github.event.pull_request.head.repo.full_name == github.repository && contains(github.event.pull_request.body, '[live-openai-research]')
        env:
          SUPABASE_DEV_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_DEV_SERVICE_ROLE_KEY }}
          SUPABASE_DEV_TEST_EMAIL: ${{ secrets.SUPABASE_DEV_TEST_EMAIL }}
          SUPABASE_DEV_TEST_PASSWORD: ${{ secrets.SUPABASE_DEV_TEST_PASSWORD }}
        run: |
          if [ -n "${SUPABASE_DEV_TEST_EMAIL}" ] || [ -n "${SUPABASE_DEV_TEST_PASSWORD}" ]; then
            if [ -z "${SUPABASE_DEV_TEST_EMAIL}" ] || [ -z "${SUPABASE_DEV_TEST_PASSWORD}" ]; then
              echo "::error::Set both SUPABASE_DEV_TEST_EMAIL and SUPABASE_DEV_TEST_PASSWORD, or use the Development Auth Admin fallback."
              exit 1
            fi
            echo "Dedicated Development test account is configured (values not printed)."
          elif [ -n "${SUPABASE_DEV_SERVICE_ROLE_KEY}" ]; then
            echo "Development-only Auth Admin fallback is configured (key value not printed)."
          else
            echo "::error::Configure a dedicated confirmed Development test account using SUPABASE_DEV_TEST_EMAIL and SUPABASE_DEV_TEST_PASSWORD, or configure SUPABASE_DEV_SERVICE_ROLE_KEY. Never use Production credentials."
            exit 1
          fi

      - name: Check out source for authenticated live mission research
        if: github.event.pull_request.head.repo.full_name == github.repository && contains(github.event.pull_request.body, '[live-openai-research]')
        uses: actions/checkout@v4

      # This additional live integration is enabled only for the explicitly marked PR run.
      # It creates its own dedicated Development test account/workspace/mission and never uses Production.
      - name: Set up Node for authenticated live mission research
        if: github.event.pull_request.head.repo.full_name == github.repository && contains(github.event.pull_request.body, '[live-openai-research]')
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install authenticated live research test dependencies
        if: github.event.pull_request.head.repo.full_name == github.repository && contains(github.event.pull_request.body, '[live-openai-research]')
        working-directory: apps/web
        run: npm ci

      - name: Install Chromium for authenticated live research test
        if: github.event.pull_request.head.repo.full_name == github.repository && contains(github.event.pull_request.body, '[live-openai-research]')
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: Verify authenticated live OpenAI mission research
        if: github.event.pull_request.head.repo.full_name == github.repository && contains(github.event.pull_request.body, '[live-openai-research]')
        timeout-minutes: 8
        working-directory: apps/web
        env:
          PREVIEW_URL: https://deploy-preview-${{ github.event.pull_request.number }}--unique-kringle-3ce321.netlify.app
          SUPABASE_URL: https://mrwmmbytcymqgwvcoywd.supabase.co
          SUPABASE_DEV_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_DEV_SERVICE_ROLE_KEY }}
          SUPABASE_DEV_TEST_EMAIL: ${{ secrets.SUPABASE_DEV_TEST_EMAIL }}
          SUPABASE_DEV_TEST_PASSWORD: ${{ secrets.SUPABASE_DEV_TEST_PASSWORD }}
        run: node test/e2e/live-preview-research.mjs
