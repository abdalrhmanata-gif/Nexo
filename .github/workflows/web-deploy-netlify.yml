name: ZAVQERA Web Deploy (Netlify)

# Deploys the ZAVQERA Web MVP (apps/web) to Netlify.
#
# This workflow is inert until the repository owner adds NETLIFY_AUTH_TOKEN.
# It never prints secret values; NEXT_PUBLIC_* values are injected as masked
# secrets so the Development backend is active in the deployed build.

on:
  workflow_dispatch:
  push:
    branches:
      - "zavqera/integrate-origin-main-clean"
      - "zavqera/alternative-web-deployment"
    paths:
      - "apps/web/**"
      - "netlify.toml"
      - ".github/workflows/web-deploy-netlify.yml"

permissions:
  contents: read

concurrency:
  group: zavqera-netlify-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check deploy credentials
        id: creds
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          if [ -z "${NETLIFY_AUTH_TOKEN}" ] || [ -z "${NETLIFY_SITE_ID}" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::NETLIFY_AUTH_TOKEN and/or NETLIFY_SITE_ID are not configured. Skipping deploy."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check Supabase Development configuration
        if: steps.creds.outputs.ready == 'true'
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "${SUPABASE_URL}" ] || [ -z "${SUPABASE_KEY}" ]; then
            echo "::error::NEXT_PUBLIC_SUPABASE_URL and NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY must be set, otherwise /app silently falls back to the local mock repository."
            exit 1
          fi
          case "${SUPABASE_URL}" in
            https://mrwmmbytcymqgwvcoywd.supabase.co*) echo "Supabase URL targets ZAVQERA Development." ;;
            *) echo "::error::NEXT_PUBLIC_SUPABASE_URL does not target ZAVQERA Development (mrwmmbytcymqgwvcoywd)."; exit 1 ;;
          esac

      - name: Setup Node
        if: steps.creds.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        if: steps.creds.outputs.ready == 'true'
        working-directory: apps/web
        run: npm ci

      - name: Static authorization boundary tests
        if: steps.creds.outputs.ready == 'true'
        working-directory: apps/web
        run: npm test

      - name: Typecheck
        if: steps.creds.outputs.ready == 'true'
        working-directory: apps/web
        run: npm run typecheck

      - name: Deploy to Netlify
        if: steps.creds.outputs.ready == 'true'
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
        run: npx --yes netlify-cli@latest deploy --build --prod

      - name: Verify public routes
        if: steps.creds.outputs.ready == 'true'
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          set -euo pipefail
          url="$(npx --yes netlify-cli@latest api getSite --data "{\"site_id\":\"${NETLIFY_SITE_ID}\"}" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).ssl_url))')"
          echo "Public URL: ${url}"

          root="$(curl -sS -o /dev/null -w '%{http_code}' "${url}/")"
          signin="$(curl -sS -o /dev/null -w '%{http_code}' "${url}/auth/sign-in")"
          app="$(curl -sS -o /dev/null -w '%{http_code}' "${url}/app")"
          appdest="$(curl -sS -o /dev/null -w '%{redirect_url}' "${url}/app")"
          echo "/=${root} /auth/sign-in=${signin} /app=${app} -> ${appdest}"

          test "${root}" = "200"
          test "${signin}" = "200"

          # With Supabase configured, middleware must bounce anonymous /app to sign-in.
          case "${appdest}" in
            *"/auth/sign-in"*) echo "Auth middleware verified." ;;
            *) echo "::error::/app did not redirect anonymously to /auth/sign-in. The deployment is likely running the local mock fallback."; exit 1 ;;
          esac
