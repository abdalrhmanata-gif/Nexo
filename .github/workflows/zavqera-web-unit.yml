name: ZAVQERA Web Unit

on:
  workflow_dispatch:
  push:
    paths:
      - "apps/web/**"
      - ".github/workflows/zavqera-web-unit.yml"
  pull_request:
    paths:
      - "apps/web/**"
      - ".github/workflows/zavqera-web-unit.yml"

permissions:
  contents: read

jobs:
  web-unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci


      - name: Pull Node runtime for OS-level egress isolation
        run: docker pull node:22-bookworm-slim

      - name: Run actual Next.js route test with container networking disabled
        run: |
          set -euo pipefail
          docker run --rm --network none \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace/apps/web \
            --env ZAVQERA_TEST_NETWORK_ISOLATED=1 \
            node:22-bookworm-slim \
            node --test test/mission-action-route-runtime.integration.test.mjs

      - name: Run Mission Authority controlled-adapter tests
        run: node --test test/mission-authority-controlled-adapter.test.mjs

      - name: Run web unit tests
        run: npm test

      - name: Typecheck web app
        run: npm run typecheck
