name: ZAVQERA W21 Isolated Browser E2E

on:
  workflow_dispatch:
  push:
    branches:
      - "zavqera/pricing-opportunity-clarity-20261028"
    paths:
      - "apps/web/**"
      - ".github/workflows/zavqera-w21-e2e.yml"
      - "supabase/test-snapshots/**"

permissions:
  contents: read

jobs:
  w21-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci

      - name: Install Playwright Chromium and system dependencies
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: Create disposable Supabase workdir
        run: |
          set -euo pipefail
          workdir="${RUNNER_TEMP}/zavqera-e2e"
          rm -rf "${workdir}"
          mkdir -p "${workdir}"

          supabase init --workdir "${workdir}"

          python3 - "${workdir}/supabase/config.toml" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          lines = path.read_text(encoding="utf-8").splitlines()

          for i, line in enumerate(lines):
              if line.startswith("project_id"):
                  lines[i] = 'project_id = "zavqera-e2e-local"'
                  break

          def set_section_value(lines, section, key, value):
              header = f"[{section}]"
              start = next((i for i, line in enumerate(lines) if line.strip() == header), None)
              if start is None:
                  if lines and lines[-1] != "":
                      lines.append("")
                  lines.extend([header, f"{key} = {value}"])
                  return

              end = next((i for i in range(start + 1, len(lines)) if lines[i].startswith("[")), len(lines))
              replacement = f"{key} = {value}"
              for i in range(start + 1, end):
                  if lines[i].lstrip().startswith(f"{key} ="):
                      lines[i] = replacement
                      break
              else:
                  lines.insert(start + 1, replacement)

          set_section_value(lines, "db", "major_version", "17")
          set_section_value(lines, "auth.email", "enable_confirmations", "false")
          path.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY

          printf '%s\n' 'zavqera-e2e-local' > "${workdir}/ZAVQERA_E2E_DISPOSABLE"

          schema_dir="${workdir}/supabase/migrations"
          mkdir -p "${schema_dir}"
          schema_file="${schema_dir}/$(date -u +%Y%m%d%H%M%S)_development_schema.sql"
          schema_source="supabase/test-snapshots/20261029204500_development_schema.sql"
          test -s "${schema_source}"
          cp "${schema_source}" "${schema_file}"

          # Auth schema is supplied by the disposable Supabase stack; this one app trigger is part of the local fixture.
          cat >> "${schema_file}" <<'SQL'

          CREATE TRIGGER on_auth_user_created
          AFTER INSERT ON auth.users FOR EACH ROW
          EXECUTE FUNCTION private.handle_new_user_profile();
          SQL

          grep -q 'VERIFIED_OUTCOME_REQUIRED' "${schema_file}"
          grep -q 'missions_initial_state' "${schema_file}"
          grep -q 'mission_actions_completion_insert_guard' "${schema_file}"
          grep -q 'handle_new_user_profile' "${schema_file}"

          echo "${workdir}" > "${RUNNER_TEMP}/zavqera-e2e-workdir"
          sha256sum "${schema_file}" > "${RUNNER_TEMP}/zavqera-e2e-schema.sha256"

      - name: Run authenticated browser E2E
        working-directory: apps/web
        env:
          ZAVQERA_E2E_MODE: disposable-full-loop
          ZAVQERA_E2E_SUPABASE_WORKDIR: ${{ runner.temp }}/zavqera-e2e
        run: |
          set -u
          unset NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY
          unset SUPABASE_SERVICE_ROLE_KEY SUPABASE_SECRET_KEY SERVICE_ROLE_KEY SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD
          unset ZAVQERA_E2E_USER_A_EMAIL ZAVQERA_E2E_USER_A_PASSWORD ZAVQERA_E2E_USER_B_EMAIL ZAVQERA_E2E_USER_B_PASSWORD
          log="${RUNNER_TEMP}/w21-e2e.log"
          result_file="${RUNNER_TEMP}/w21-e2e-result.env"

          # Disable errexit only around the test command so its exit code is
          # always captured and persisted before any later validation runs.
          set +e
          npm run test:e2e -- --grep "authenticated Opportunity Intelligence backup flow" > "${log}" 2>&1
          status=$?
          set -e

          cat "${log}"
          printf 'e2e_exit_status=%s\n' "${status}" > "${result_file}"
          echo "W21 E2E exit status: ${status}"

          if grep -q '"cleanup"[[:space:]]*:[[:space:]]*"VERIFIED"' "${log}"; then
            echo "W21 cleanup proof: VERIFIED"
          else
            echo "::error::W21 cleanup proof not found in the test output."
            status=1
            printf 'e2e_exit_status=%s\n' "${status}" > "${result_file}"
          fi
          exit "${status}"

      - name: Write W21 evidence
        if: always()
        run: |
          set -euo pipefail
          e2e_status="not-recorded"
          if [ -s "${RUNNER_TEMP}/w21-e2e-result.env" ]; then
            e2e_status="$(sed -n 's/^e2e_exit_status=//p' "${RUNNER_TEMP}/w21-e2e-result.env" | tail -n 1)"
          fi
          cleanup="NOT_VERIFIED_OR_RUN_DID_NOT_REACH_TEARDOWN"
          if [ -f "${RUNNER_TEMP}/w21-e2e.log" ] && grep -q '"cleanup"[[:space:]]*:[[:space:]]*"VERIFIED"' "${RUNNER_TEMP}/w21-e2e.log"; then
            cleanup="VERIFIED"
          fi
          schema_sha256="not-generated"
          if [ -f "${RUNNER_TEMP}/zavqera-e2e-schema.sha256" ]; then
            schema_sha256="$(cut -d' ' -f1 "${RUNNER_TEMP}/zavqera-e2e-schema.sha256")"
          fi
          {
            echo "result=${{ job.status }}"
            echo "git_sha=${GITHUB_SHA}"
            echo "utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "node=$(node --version)"
            echo "npm=$(npm --version)"
            echo "supabase_cli=$(supabase --version)"
            echo "playwright=$(cd apps/web && npx --no-install playwright --version)"
            echo "postgres_major=17"
            echo "e2e_exit_status=${e2e_status}"
            echo "schema_sha256=${schema_sha256}"
            echo "cleanup=${cleanup}"
          } > "${RUNNER_TEMP}/W21_EVIDENCE.txt"

          if [ "${e2e_status}" != "0" ]; then
            echo "::error::W21 E2E exit status was not recorded as 0 (actual: ${e2e_status})."
            exit 1
          fi
          if [ "${cleanup}" != "VERIFIED" ]; then
            echo "::error::W21 cleanup proof is missing."
            exit 1
          fi

      - name: Upload sanitized W21 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zavqera-w21-evidence
          path: ${{ runner.temp }}/W21_EVIDENCE.txt
          if-no-files-found: error
