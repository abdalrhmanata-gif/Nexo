name: ZAVQERA W21 Local Launch Gate

on:
  workflow_dispatch:
  push:
    branches:
      - "zavqera/ai-planner-integration"

concurrency:
  group: zavqera-w21-local-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  w21-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci

      - name: Install Chromium
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: Prepare disposable PG17 migration replay
        run: |
          set -euo pipefail
          workdir="$RUNNER_TEMP/zavqera-e2e"
          rm -rf "$workdir"
          mkdir -p "$workdir"
          supabase init --workdir "$workdir"
          python3 - "$workdir/supabase/config.toml" <<'PY'
          from pathlib import Path
          import sys
          p = Path(sys.argv[1])
          lines = p.read_text().splitlines()
          for i, line in enumerate(lines):
              if line.startswith("project_id"):
                  lines[i] = 'project_id = "zavqera-e2e-local"'
                  break
          def setv(lines, section, key, value):
              header = f"[{section}]"
              start = next((i for i, line in enumerate(lines) if line.strip() == header), None)
              if start is None:
                  if lines and lines[-1] != "": lines.append("")
                  lines += [header, f"{key} = {value}"]
                  return
              end = next((i for i in range(start + 1, len(lines)) if lines[i].startswith("[")), len(lines))
              for i in range(start + 1, end):
                  if lines[i].lstrip().startswith(f"{key} ="):
                      lines[i] = f"{key} = {value}"
                      break
              else:
                  lines.insert(start + 1, f"{key} = {value}")
          setv(lines, "db", "major_version", "17")
          setv(lines, "auth", "site_url", '"http://127.0.0.1:3210"')
          setv(lines, "auth", "additional_redirect_urls", '["http://127.0.0.1:3210/**"]')
          setv(lines, "auth.email", "enable_confirmations", "false")
          setv(lines, "auth.email.template.recovery", "subject", '"Reset your ZAVQERA password"')
          setv(lines, "auth.email.template.recovery", "content_path", '"./supabase/templates/recovery.html"')
          p.write_text("\n".join(lines) + "\n")
          PY
          mkdir -p "$workdir/supabase/templates"
          cat > "$workdir/supabase/templates/recovery.html" <<'HTML'
          <!doctype html>
          <html><body>
          <h2>Reset your ZAVQERA password</h2>
          <p><a href="{{ .ConfirmationURL }}">Reset password</a></p>
          </body></html>
          HTML
          mkdir -p "$workdir/volumes/db/init"
          cat > "$workdir/volumes/db/init/00_private_schema.sql" <<'SQL'
          create schema if not exists private;
          SQL
          cp -R "$GITHUB_WORKSPACE/supabase/migrations/." "$workdir/supabase/migrations/"
          cat > "$workdir/supabase/migrations/20260921180005_e2e_historical_auth_compat.sql" <<'SQL'
          create schema if not exists private;
          create or replace function private.handle_new_user_profile()
          returns trigger
          language plpgsql
          security definer
          set search_path = pg_catalog, public
          as $body$
          begin
            insert into public.profiles (id)
            values (new.id)
            on conflict (id) do nothing;
            return new;
          end;
          $body$;
          revoke all privileges on function private.handle_new_user_profile() from public, anon, authenticated;
          create or replace function public.handle_new_user_profile()
          returns trigger
          language plpgsql
          security definer
          set search_path = pg_catalog, public
          as $body$
          begin
            insert into public.profiles (id)
            values (new.id)
            on conflict (id) do nothing;
            return new;
          end;
          $body$;
          revoke all privileges on function public.handle_new_user_profile() from public, anon, authenticated;
          drop trigger if exists on_auth_user_created on auth.users;
          create trigger on_auth_user_created
          after insert on auth.users
          for each row execute function private.handle_new_user_profile();
          SQL
          printf "%s\n" "zavqera-e2e-local" > "$workdir/ZAVQERA_E2E_DISPOSABLE"
          echo "ZAVQERA_E2E_SUPABASE_WORKDIR=$workdir" >> "$GITHUB_ENV"
          echo "ZAVQERA_E2E_MODE=disposable-full-loop" >> "$GITHUB_ENV"
          echo "ZAVQERA_E2E_MIGRATION_SOURCE=repo-migrations" >> "$GITHUB_ENV"
          echo "ZAVQERA_AI_PROVIDER_MODE=mock" >> "$GITHUB_ENV"

      - name: Run launch-gate browser E2E
        working-directory: apps/web
        run: |
          set -euo pipefail
          unset NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY
          unset SUPABASE_SERVICE_ROLE_KEY SUPABASE_SECRET_KEY SERVICE_ROLE_KEY SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD
          npm run test:e2e -- --grep "ZAVQERA launch gate"

      - name: Write evidence
        if: always()
        run: |
          set -euo pipefail
          {
            echo "result=${{ job.status }}"
            echo "git_sha=${GITHUB_SHA}"
            echo "migration_source=repo-migrations"
            echo "postgres_major=17"
          } > "$RUNNER_TEMP/W21_EVIDENCE.txt"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zavqera-w21-evidence
          path: ${{ runner.temp }}/W21_EVIDENCE.txt
          if-no-files-found: error
