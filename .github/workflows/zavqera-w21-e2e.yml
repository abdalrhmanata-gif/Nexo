name: ZAVQERA W21 Isolated Browser E2E

on:
  workflow_dispatch:
  push:
    branches:
      - "zavqera/ai-planner-integration"

permissions:
  contents: read

jobs:
  w21-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci

      - name: Create disposable Supabase workdir from repository migrations
        run: |
          set -euo pipefail
          workdir="${RUNNER_TEMP}/zavqera-e2e"
          rm -rf "${workdir}"
          mkdir -p "${workdir}"

          supabase init --workdir "${workdir}"

          python3 - "${workdir}/supabase/config.toml" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          lines = path.read_text(encoding="utf-8").splitlines()

          for i, line in enumerate(lines):
              if line.startswith("project_id"):
                  lines[i] = 'project_id = "zavqera-e2e-local"'
                  break

          def set_section_value(lines, section, key, value):
              header = f"[{section}]"
              start = next((i for i, line in enumerate(lines) if line.strip() == header), None)
              if start is None:
                  if lines and lines[-1] != "":
                      lines.append("")
                  lines.extend([header, f"{key} = {value}"])
                  return
              end = next((i for i in range(start + 1, len(lines)) if lines[i].startswith("[")), len(lines))
              replacement = f"{key} = {value}"
              for i in range(start + 1, end):
                  if lines[i].lstrip().startswith(f"{key} ="):
                      lines[i] = replacement
                      break
              else:
                  lines.insert(start + 1, replacement)

          set_section_value(lines, "db", "major_version", "17")
          set_section_value(lines, "auth.email", "enable_confirmations", "false")
          path.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY

          cp -R supabase/migrations/. "${workdir}/supabase/migrations/"

          cat > "${workdir}/supabase/migrations/20260921180005_e2e_historical_auth_compat.sql" <<'SQL'
          create schema if not exists private;

          create or replace function public.handle_new_user_profile()
          returns trigger
          language plpgsql
          security definer
          set search_path = pg_catalog, public
          as $body$
          begin
            insert into public.profiles (id)
            values (new.id)
            on conflict (id) do nothing;
            return new;
          end;
          $body$;

          revoke all privileges on function public.handle_new_user_profile() from public, anon, authenticated;
          SQL

          printf '%s\n' 'zavqera-e2e-local' > "${workdir}/ZAVQERA_E2E_DISPOSABLE"
          printf '%s\n' "${workdir}" > "${RUNNER_TEMP}/zavqera-e2e-workdir"
          echo "migration_source=repo-migrations" > "${RUNNER_TEMP}/zavqera-e2e-source"
      - name: Run authenticated browser E2E
        working-directory: apps/web
        env:
          ZAVQERA_E2E_MODE: disposable-full-loop
          ZAVQERA_E2E_MIGRATION_SOURCE: repo-migrations
          ZAVQERA_E2E_SUPABASE_WORKDIR: ${{ runner.temp }}/zavqera-e2e
        run: |
          set -u
          unset NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY
          unset SUPABASE_SERVICE_ROLE_KEY SUPABASE_SECRET_KEY SERVICE_ROLE_KEY SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD
          unset ZAVQERA_E2E_USER_A_EMAIL ZAVQERA_E2E_USER_A_PASSWORD ZAVQERA_E2E_USER_B_EMAIL ZAVQERA_E2E_USER_B_PASSWORD
          log="${RUNNER_TEMP}/w21-e2e.log"
          npm run test:e2e 2>&1 | tee "${log}"
          status="${PIPESTATUS[0]}"
          printf 'e2e_exit_status=%s\n' "${status}" > "${RUNNER_TEMP}/w21-e2e-result.env"
          if grep -q '"cleanup"[[:space:]]*:[[:space:]]*"VERIFIED"' "${log}"; then
            echo "W21 cleanup proof: VERIFIED"
          else
            echo "::error::W21 cleanup proof not found in the test output."
            status=1
          fi
          exit "${status}"

      - name: Write W21 evidence
        if: always()
        run: |
          set -euo pipefail
          {
            echo "result=${{ job.status }}"
            echo "git_sha=${GITHUB_SHA}"
            echo "utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "node=$(node --version)"
            echo "npm=$(npm --version)"
            echo "supabase_cli=$(supabase --version)"
            echo "playwright=$(cd apps/web && npx --no-install playwright --version)"
            echo "postgres_major=17"
            if [ -f "${RUNNER_TEMP}/zavqera-e2e-source" ]; then cat "${RUNNER_TEMP}/zavqera-e2e-source"; fi
            if [ -f "${RUNNER_TEMP}/zavqera-e2e-result.env" ]; then
              cat "${RUNNER_TEMP}/zavqera-e2e-result.env"
            else
              echo "e2e_exit_status=not-recorded"
            fi
            if [ -f "${RUNNER_TEMP}/zavqera-e2e-schema.sha256" ]; then
              echo -n "schema_sha256="
              cut -d' ' -f1 "${RUNNER_TEMP}/zavqera-e2e-schema.sha256"
            fi
            if [ -f "${RUNNER_TEMP}/w21-e2e.log" ] && grep -q '"cleanup"[[:space:]]*:[[:space:]]*"VERIFIED"' "${RUNNER_TEMP}/w21-e2e.log"; then
              echo "cleanup=VERIFIED"
            else
              echo "cleanup=NOT_VERIFIED_OR_RUN_DID_NOT_REACH_TEARDOWN"
            fi
          } > "${RUNNER_TEMP}/W21_EVIDENCE.txt"

      - name: Upload sanitized W21 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zavqera-w21-evidence
          path: ${{ runner.temp }}/W21_EVIDENCE.txt
          if-no-files-found: error
